[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlx-breeze-tts2"
version = "0.1.0"
description = "Standalone Breeze TTS 2 inference, conversion, and serving on Apple Silicon with MLX"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
dependencies = [
  "huggingface-hub>=0.27",
  "mlx>=0.31.1",
  "numpy>=1.26",
  "safetensors>=0.4",
  "scipy>=1.10",
  "soundfile>=0.12",
  "transformers>=4.48",
]

[project.optional-dependencies]
server = ["fastapi>=0.115", "python-multipart>=0.0.20", "uvicorn>=0.34"]
dev = ["pytest>=8", "ruff>=0.9"]
evaluation = [
  "librosa>=0.11",
  "speechbrain>=1.1",
  "torch>=2.6",
  "torchaudio>=2.6",
]

[project.scripts]
mlx-breeze-tts2 = "mlx_breeze_tts.cli:main"
mlx-breeze = "mlx_breeze_tts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"src/mlx_breeze_tts/core/*.py" = ["E741"]
"tests/test_architecture.py" = ["E402"]
"tests/test_model.py" = ["E402"]
